# alomp_config.yaml — ACOMP Full Configuration
#
# ╔══════════════════════════════════════════════════════════════════╗
# ║  OPERATING MODE  (change this to switch ACOMP behaviour)        ║
# ║  strategic   — balanced, stable, cost-aware (DEFAULT)           ║
# ║  aggressive  — fastest response, highest replica counts          ║
# ║  conservative— minimal scaling, cost-optimised                   ║
# ╚══════════════════════════════════════════════════════════════════╝

mode: strategic

modes:
  strategic:
    description: "Balanced production mode — SLO-compliant with cost awareness"
    cpu_threshold: 0.70
    slope_threshold: 0.15
    slope_min_cycles: 2
    pre_scale_cpu_override: 0.50
    cooldown_seconds: 30
    hysteresis_cycles: 10
    poll_fast_seconds: 5
    poll_base_seconds: 15
    poll_slow_seconds: 30
    max_replicas_cap: 10
    propagation_threshold: 0.30
    slo_violation_window: 3

  aggressive:
    description: "Maximum throughput — fastest response, accepts higher cost"
    cpu_threshold: 0.50
    slope_threshold: 0.08
    slope_min_cycles: 1
    pre_scale_cpu_override: 0.35
    cooldown_seconds: 10
    hysteresis_cycles: 5
    poll_fast_seconds: 3
    poll_base_seconds: 10
    poll_slow_seconds: 20
    max_replicas_cap: 20
    propagation_threshold: 0.15
    slo_violation_window: 1

  conservative:
    description: "Cost-optimised — minimal scaling, tolerates higher latency"
    cpu_threshold: 0.85
    slope_threshold: 0.30
    slope_min_cycles: 4
    pre_scale_cpu_override: 0.75
    cooldown_seconds: 60
    hysteresis_cycles: 20
    poll_fast_seconds: 10
    poll_base_seconds: 20
    poll_slow_seconds: 60
    max_replicas_cap: 6
    propagation_threshold: 0.50
    slo_violation_window: 5

events:
  - name: "Black Friday 2026"
    status: inactive
    start: "2026-11-27T00:00:00Z"
    end:   "2026-11-28T23:59:00Z"
    expected_users: 5000
    baseline_users: 200
    pre_scale_hours: 2
    rampdown_minutes: 30
    mode_override: aggressive
    notes: "Annual peak — 25x normal traffic expected"

  - name: "Cyber Monday 2026"
    status: inactive
    start: "2026-11-30T09:00:00Z"
    end:   "2026-11-30T23:59:00Z"
    expected_users: 3500
    baseline_users: 200
    pre_scale_hours: 1
    rampdown_minutes: 20
    mode_override: aggressive
    notes: "Post-Black Friday surge"

  - name: "Planned Load Test"
    status: inactive
    start: "2026-08-01T10:00:00Z"
    end:   "2026-08-01T12:00:00Z"
    expected_users: 1000
    baseline_users: 200
    pre_scale_hours: 0
    rampdown_minutes: 10
    mode_override: strategic
    notes: "Internal load test"

maintenance_windows:
  - name: "Weekly DB Backup"
    status: active
    cron: "0 2 * * 0"
    duration_minutes: 30
    affected_services: [cartservice, redis-cart]
    action: freeze_scaling
    notes: "Redis backup causes CPU spike — not real load"

  - name: "Nightly Certificate Rotation"
    status: active
    cron: "0 3 * * *"
    duration_minutes: 5
    affected_services: [frontend, checkoutservice]
    action: freeze_scaling
    notes: "TLS cert rotation brief CPU spike"

  - name: "Monthly Patching Window"
    status: inactive
    cron: "0 1 1 * *"
    duration_minutes: 60
    affected_services: []
    action: scale_down
    notes: "Full cluster patching"

anomaly_budgets:
  enabled: true
  reset_day: 1
  budget_file: "results/anomaly_budgets.json"
  services:
    frontend:           {monthly_violation_budget: 50, conservative_threshold: 0.55}
    currencyservice:    {monthly_violation_budget: 30, conservative_threshold: 0.50}
    checkoutservice:    {monthly_violation_budget: 20, conservative_threshold: 0.45}
    cartservice:        {monthly_violation_budget: 40, conservative_threshold: 0.55}
    productcatalogservice: {monthly_violation_budget: 60, conservative_threshold: 0.60}
    recommendationservice: {monthly_violation_budget: 80, conservative_threshold: 0.65}

traffic_patterns:
  enabled: true
  pre_scale_minutes: 15
  pattern_file: "results/traffic_patterns.json"
  hourly_defaults:
    0: 0.3
    6: 0.5
    8: 0.8
    9: 1.0
    12: 1.2
    14: 1.1
    17: 1.3
    18: 1.4
    20: 1.1
    22: 0.6

pipeline:
  services:
    - name: frontend
      downstream:
        - {service: productcatalogservice, work_factor: 1.297}
        - {service: cartservice,           work_factor: 0.595}
        - {service: checkoutservice,       work_factor: 0.018}
        - {service: currencyservice,       work_factor: 1.573}
        - {service: shippingservice,       work_factor: 0.113}
        - {service: recommendationservice, work_factor: 1.078}
        - {service: adservice,             work_factor: 0.238}

    - name: checkoutservice
      downstream:
        - {service: paymentservice,        work_factor: 0.409}
        - {service: emailservice,          work_factor: 0.744}
        - {service: shippingservice,       work_factor: 6.280}
        - {service: currencyservice,       work_factor: 87.208}
        - {service: cartservice,           work_factor: 33.014}
        - {service: productcatalogservice, work_factor: 71.938}

    - name: cartservice
      downstream:
        - {service: redis-cart, work_factor: 0.545}

    - name: recommendationservice
      downstream:
        - {service: productcatalogservice, work_factor: 1.205}

  guardrails:
    min_replicas: 1
    max_replicas: 10
    propagation_threshold: 0.30
